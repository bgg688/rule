proxy-providers:
  sub1:
    url: "https://subpush.gaminggod.top/token=xxx"
    type: http
    interval: 36000
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

proxies:
  - {name: 直连, type: direct}

mixed-port: 7890
allow-lan: false #change
bind-address: "*"
mode: rule 
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true


dns:
  enable: true
  listen: 127.0.0.1:1053 #add
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
  default-nameserver: #给用域名的dnsserver做解析
    - 223.5.5.5
  direct-nameserver: #给指定直连域名做解析
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - 1.1.1.1#🚀 默认代理
    - 8.8.8.8#🚀 默认代理

 
proxy-groups:
  - {name: 🚀 默认代理, type: select, use: [sub1], proxies: [♻️ Reality测试,♻️ H2测试]}
  - {name: 💱 crypto, type: select, use: [sub1], proxies: [♻️ 辅测, ♻️ Reality测试]}
  - {name: 📲 Telegram, type: select, use: [sub1], proxies: [♻️ Reality测试]}
  - {name: 📹 YouTube, type: select, use: [sub1], proxies: [♻️ Reality测试,♻️ H2测试]}
  - {name: 🍀 Google, type: select, use: [sub1], proxies: [♻️ Reality测试]}
  - {name: 🤖 AI, type: select, use: [sub1], proxies: [♻️ Reality测试]}
  - {name: 👨🏿‍💻 GitHub, type: select, use: [sub1], proxies: [♻️ Reality测试]}
  - {name: 🎵 社媒TK, type: select, use: [sub1], proxies: [♻️ Reality测试,♻️ H2测试]}
  - {name: 📹 Porn, type: select, use: [sub1], proxies: [♻️ Reality测试,♻️ H2测试]}
  - {name: 🪟 Microsoft, type: select, use: [sub1], proxies: [直连]}
  - {name: 🐟 漏网之鱼, type: select, use: [sub1], proxies: [🚀 默认代理, ♻️ H2测试, 直连]}
  - {name: ♻️ H2测试, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^(?=.*(澳洲|洛城|荷兰|坡县))(?=.*H2).*$"}
  - {name: ♻️ 辅测, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^(?=.*(首尔))(?=.*[Rr]eality).*$"}
  - {name: ♻️ Reality测试, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^(?=.*(澳洲|洛城|荷兰|坡县))(?=.*[Rr]eality).*$"}

# 规则匹配
rules:
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private,直连
  - RULE-SET,apple,直连
  - RULE-SET,teslacn,直连
  - RULE-SET,tesla,直连
  - RULE-SET,xiaomi,直连
  - RULE-SET,crypto,💱 crypto
  - RULE-SET,discord,📲 Telegram
  - RULE-SET,telegram,📲 Telegram
  - RULE-SET,youtube,📹 YouTube
  - RULE-SET,speedtest,📹 YouTube
  - RULE-SET,google,🍀 Google
  - RULE-SET,ai,🤖 AI
  - RULE-SET,github,👨🏿‍💻 GitHub
  - RULE-SET,tiktok,🎵 社媒TK
  - RULE-SET,media,🎵 社媒TK
  - RULE-SET,porn,📹 Porn
  - RULE-SET,microsoft,🪟 Microsoft
  - RULE-SET,cn,直连
  - RULE-SET,geolocation-!cn,🚀 默认代理
  - RULE-SET,apple_ip,直连
  - RULE-SET,google_ip,🍀 Google
  - RULE-SET,telegram_ip,📲 Telegram
  - RULE-SET,cn_ip,直连
  - MATCH,🐟 漏网之鱼

rule-anchor:
